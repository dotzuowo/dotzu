name: WinBoost desktop preview
on:
  push:
    paths:
      - 'src/v0.9/*.xaml'
      - 'tests/Test-Presentation.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate desktop navigation and render the window
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/Test-Presentation.ps1 -Source src/v0.9 -OutputDirectory preview
      - uses: actions/upload-artifact@v4
        with:
          name: WinBoost-desktop
          path: preview
