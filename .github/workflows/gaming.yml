name: Gaming profile
on:
  push:
    paths:
      - 'src/v0.9/**'
      - 'tests/**'
      - 'tools/**'
      - 'WinBoost.ps1'
      - 'install.ps1'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply, repeat and restore the selected game settings
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Test-Gaming.ps1 -Source src/v0.9
